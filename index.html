<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#24144d">
<title>Colton Clicker</title>
<style>
:root{color-scheme:dark;--bg:#100b20;--panel:#1b1430;--panel2:#261b40;--accent:#a78bfa;--gold:#fbbf24;--text:#f5f3ff;--muted:#c4b5fd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#35215c 0,#160f29 45%,#0d0918 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;color:inherit;cursor:pointer}.app{max-width:1150px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand h1{font-size:clamp(1.7rem,4vw,2.5rem);margin:0}.brand p{margin:4px 0;color:var(--muted)}.top-actions{display:flex;gap:8px}.secondary{border:1px solid #554477;background:#241a3a;padding:9px 13px;border-radius:10px}.secondary:hover,.buy:hover{filter:brightness(1.12)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.stat{background:#211834;border:1px solid #43345f;border-radius:12px;padding:10px 15px;min-width:130px}.stat small{display:block;color:var(--muted);font-size:.77rem}.stat strong{font-size:1.15rem}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(290px,.8fr);gap:18px}.panel{background:linear-gradient(145deg,rgba(38,27,64,.96),rgba(25,18,43,.96));border:1px solid #4a3867;border-radius:18px;padding:20px;box-shadow:0 12px 35px #0003}.click-panel{min-height:480px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative}.click-panel:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:#8b5cf622;filter:blur(40px)}.count-label{z-index:1;color:var(--muted);font-size:1.1rem}.count{z-index:1;font-size:clamp(2rem,7vw,4rem);font-weight:900;letter-spacing:-.04em;margin:4px 0 15px}.colton-button{z-index:1;border:0;background:linear-gradient(145deg,#c4b5fd,#7c3aed 62%,#5b21b6);width:min(235px,58vw);aspect-ratio:1;border-radius:50%;font-size:6.4rem;box-shadow:inset 0 8px 18px #fff5,inset 0 -12px 20px #2e1065aa,0 15px 35px #0007;transition:transform .08s,filter .15s;touch-action:manipulation}.colton-button:hover{filter:brightness(1.1);transform:translateY(-3px)}.colton-button:active{transform:scale(.94)}.hint{z-index:1;color:#d8ccf4;margin-top:16px}.float{position:absolute;z-index:2;pointer-events:none;color:var(--gold);font-size:1.5rem;font-weight:900;animation:floatUp .8s ease-out forwards}@keyframes floatUp{to{transform:translateY(-85px);opacity:0}}.shop h2{margin:0 0 5px}.shop-intro{color:var(--muted);margin:0 0 14px;font-size:.92rem}.upgrades{display:grid;gap:9px}.upgrade{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:10px;padding:10px;background:#1a132a;border:1px solid #46345f;border-radius:12px}.upgrade-icon{font-size:1.8rem;text-align:center}.upgrade h3{margin:0;font-size:.97rem}.upgrade p{margin:3px 0 0;color:#c7bddb;font-size:.79rem;line-height:1.3}.buy{border:1px solid #765ca3;background:#49316e;padding:8px 10px;border-radius:9px;font-weight:800;min-width:83px}.buy:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}.message{min-height:22px;margin-top:10px;color:#fde68a;font-size:.88rem}.footer{text-align:center;color:#a89bbf;margin:18px 0 4px;font-size:.82rem}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#34244d;border:1px solid #8b6bb7;padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.app{padding:14px}.layout{grid-template-columns:1fr}.click-panel{min-height:390px}.shop{padding:16px}.stats{margin:13px 0}.stat{flex:1;min-width:100px;padding:9px 10px}.upgrade{grid-template-columns:40px 1fr auto;gap:7px}.buy{min-width:74px;padding:7px 8px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><h1>✨ Colton Clicker</h1><p>Click Colton. Build the Coltonverse.</p></div><div class="top-actions"><button class="secondary" id="saveBtn" type="button">Save</button><button class="secondary" id="resetBtn" type="button">Reset</button></div></header>
<section class="stats" aria-label="Game statistics"><div class="stat"><small>COLTONS</small><strong id="count">0</strong></div><div class="stat"><small>PER CLICK</small><strong id="perClick">1</strong></div><div class="stat"><small>COLTONS / SEC</small><strong id="perSecond">0</strong></div><div class="stat"><small>TOTAL COLTONS</small><strong id="lifetime">0</strong></div></section>
<div class="layout"><section class="panel click-panel" id="clickPanel"><div class="count-label">You have</div><div class="count"><span id="mainCount">0</span> Coltons</div><button id="coltonButton" class="colton-button" type="button" aria-label="Click Colton">😎</button><div class="hint">Tap Colton to make more Coltons!</div></section>
<section class="panel shop"><h2>Colton Crew</h2><p class="shop-intro">Recruit helpers to grow your Colton empire.</p><div class="upgrades" id="upgrades"></div><div class="message" id="message" aria-live="polite"></div></section></div>
<p class="footer">Your progress saves automatically in this browser.</p>
</main><div class="toast" id="toast" role="status">Game saved!</div>
<script>
'use strict';
const upgrades=[
{id:'buddy',name:'Colton Buddy',icon:'🧑‍🤝‍🧑',description:'A friend helps you click.',baseCost:15,baseRate:.2,owned:0},
{id:'snack',name:'Colton Snack Stand',icon:'🍕',description:'More snacks, more Coltons.',baseCost:100,baseRate:1,owned:0},
{id:'club',name:'Colton Fan Club',icon:'📣',description:'Fans spread the Colton spirit.',baseCost:750,baseRate:6,owned:0},
{id:'arcade',name:'Colton Arcade',icon:'🕹️',description:'The hottest game in town.',baseCost:5000,baseRate:35,owned:0},
{id:'factory',name:'Colton Factory',icon:'🏭',description:'Industrial-strength Colton production.',baseCost:35000,baseRate:200,owned:0},
{id:'moon',name:'Colton Moon Base',icon:'🌙',description:'Colton production: out of this world.',baseCost:250000,baseRate:1200,owned:0}
];
let coltons=0,lifetime=0,clickPower=1,lastTick=Date.now(),toastTimer;
const $=id=>document.getElementById(id);
const format=n=>{if(n<1000)return Math.floor(n).toLocaleString();const units=['K','M','B','T','Qa','Qi'];let i=-1;while(n>=1000&&i<units.length-1){n/=1000;i++}return n.toFixed(n>=100?0:n>=10?1:2)+units[i]};
function rate(){return upgrades.reduce((sum,u)=>sum+u.owned*u.baseRate,0)}
function cost(u){return Math.ceil(u.baseCost*Math.pow(1.15,u.owned))}
function renderShop(){const root=$('upgrades');root.replaceChildren();for(const u of upgrades){const row=document.createElement('article');row.className='upgrade';row.innerHTML=`<div class="upgrade-icon" aria-hidden="true">${u.icon}</div><div><h3>${u.name} <span style="color:#c4b5fd;font-size:.8rem">×${u.owned}</span></h3><p>${u.description} +${format(u.baseRate)} Coltons/sec</p></div><button class="buy" type="button" data-id="${u.id}">${format(cost(u))} 🟣</button>`;root.appendChild(row)}root.querySelectorAll('.buy').forEach(button=>button.addEventListener('click',()=>buy(button.dataset.id)));update()}
function update(){const perSec=rate();$('count').textContent=format(coltons);$('mainCount').textContent=format(coltons);$('perClick').textContent=format(clickPower);$('perSecond').textContent=format(perSec);$('lifetime').textContent=format(lifetime);document.querySelectorAll('.buy').forEach(button=>{const u=upgrades.find(x=>x.id===button.dataset.id);button.disabled=coltons<cost(u);button.textContent=`${format(cost(u))} 🟣`})}
function add(n){if(!Number.isFinite(n)||n<=0)return;coltons+=n;lifetime+=n;update()}
function buy(id){const u=upgrades.find(x=>x.id===id);if(!u)return;const price=cost(u);if(coltons<price)return;coltons-=price;u.owned++;$('message').textContent=`${u.name} joined your crew!`;renderShop();save(false)}
function save(showToast=true){try{localStorage.setItem('coltonClickerSave',JSON.stringify({coltons,lifetime,clickPower,upgrades:upgrades.map(({id,owned})=>({id,owned}))}));if(showToast){const t=$('toast');t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1500)}}catch(e){$('message').textContent='Could not save in this browser.'}}
function load(){try{const data=JSON.parse(localStorage.getItem('coltonClickerSave'));if(!data)return;coltons=Math.max(0,Number(data.coltons)||0);lifetime=Math.max(coltons,Number(data.lifetime)||0);clickPower=Math.max(1,Number(data.clickPower)||1);for(const saved of data.upgrades||[]){const u=upgrades.find(x=>x.id===saved.id);if(u)u.owned=Math.max(0,Math.floor(Number(saved.owned)||0))}}catch(e){$('message').textContent='Save data could not be loaded.'}}
$('coltonButton').addEventListener('click',e=>{add(clickPower);const panel=$('clickPanel'),r=panel.getBoundingClientRect(),float=document.createElement('span');float.className='float';float.textContent=`+${format(clickPower)}`;float.style.left=`${Math.max(10,Math.min(r.width-65,e.clientX-r.left))}px`;float.style.top=`${Math.max(40,e.clientY-r.top-15)}px`;panel.appendChild(float);setTimeout(()=>float.remove(),850)});
$('saveBtn').addEventListener('click',()=>save());$('resetBtn').addEventListener('click',()=>{if(!confirm('Reset all Colton Clicker progress? This cannot be undone.'))return;localStorage.removeItem('coltonClickerSave');coltons=0;lifetime=0;clickPower=1;upgrades.forEach(u=>u.owned=0);$('message').textContent='Fresh start! Click Colton to begin.';renderShop()});
load();renderShop();setInterval(()=>{const now=Date.now(),elapsed=Math.min((now-lastTick)/1000,10);lastTick=now;add(rate()*elapsed)},250);setInterval(()=>save(false),10000);window.addEventListener('beforeunload',()=>save(false));
</script>
</body>
</html>
